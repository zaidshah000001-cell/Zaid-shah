<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1a"><title>Nawab Ride V4</title><style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#edf5ff;background:#090f1a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172b39,#090f1a 65%)}.app{max-width:540px;margin:auto;padding:22px 16px 40px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:850;letter-spacing:-.6px}.brand span{color:#43dfad}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:disabled{opacity:.35}.iconbtn{background:#1c2a3b;border:1px solid #324456;border-radius:14px;padding:11px 13px}.tabs{display:flex;gap:6px;background:#111d2c;padding:5px;border-radius:16px;margin:23px 0 15px}.tabs button{flex:1;padding:12px 4px;border-radius:12px;background:transparent;color:#94a8bb;font-size:13px;font-weight:750}.tabs button.active{background:#285b51;color:#b6ffe2}.panel{background:linear-gradient(145deg,#1b3041,#112130);border:1px solid #2c4453;border-radius:25px;padding:20px;box-shadow:0 12px 40px #0003}.small{font-size:12px;color:#9fb2c2}.muted{color:#9fb2c2}.balance{font-size:43px;font-weight:850;letter-spacing:-1.8px;margin:9px 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #344757;padding-top:15px}.green{color:#49e1aa}.red{color:#ff777e}.stats strong{display:block;font-size:21px;margin-top:6px}.navdate{display:flex;justify-content:space-between;align-items:center;gap:8px}.navdate button{background:#263e4b;border-radius:12px;padding:8px 13px}.navdate .center{text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 23px}.action{padding:24px 8px;border-radius:22px;font-weight:800;font-size:16px;display:grid;justify-items:center;gap:12px}.action b{font-size:34px;font-weight:400}.add{background:#103b30;border:1px solid #2d7960;color:#76f5c1}.spend{background:#3a1e29;border:1px solid #844351;color:#ff9da4}.sectiontitle{font-size:18px;font-weight:800;margin:18px 0 12px}.goalgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.goal{border:1px solid #294154;background:#132435;border-radius:19px;padding:12px 6px;text-align:center;min-width:0}.goal .name{font-size:12px;font-weight:800}.ring{width:82px;height:82px;margin:9px auto;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .percent{position:absolute;inset:0;display:grid;place-items:center;font-weight:850;font-size:16px}.goal .number{font-size:11px;overflow-wrap:anywhere}.goal .remaining{font-size:10px;color:#9fb2c2;margin-top:5px}.transactions{margin-top:22px}.entry{display:flex;justify-content:space-between;gap:8px;padding:14px 0;border-bottom:1px solid #273747}.entry .detail{font-size:12px;color:#93a9ba;margin-top:4px}.empty{text-align:center;color:#8ba3b7;padding:25px 4px}.pagehead{margin:24px 0;font-size:24px;font-weight:850}.itembtn{width:100%;background:#15283a;border:1px solid #304558;border-radius:17px;padding:17px;margin:8px 0;text-align:left;font-weight:700}.field{margin:18px 0}.field label{display:block;margin-bottom:8px;color:#b4c6d5;font-size:14px}input,select{width:100%;background:#142537;border:1px solid #3a5366;border-radius:13px;padding:15px;color:white;outline:none}input:focus{border-color:#52dcb0}.primary{width:100%;padding:16px;background:#2ebc8d;color:#071b16;border-radius:14px;font-weight:850;margin-top:12px}.danger{background:#d34d60;color:white}.secondary{background:#24384a;color:white}.hint{color:#9bb0c2;font-size:13px;line-height:1.5}.center{text-align:center}.delete-ring{width:184px;height:184px;position:relative;margin:25px auto}.delete-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.delete-ring .count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:48px;font-weight:850}.delete-ring small{font-size:12px;font-weight:500;color:#9db1c3}.toast{position:fixed;bottom:25px;left:10%;width:80%;background:#2b4b50;border-radius:12px;padding:14px;text-align:center;z-index:5;box-shadow:0 5px 20px #0008} .hidden{display:none} .pills{display:flex;gap:6px}.pills button{flex:1;border-radius:10px;padding:12px 5px;background:#1c3043;font-size:12px}.pills button.active{background:#2d6e5b}
</style></head><body><main class="app" id="app"></main><div id="toast" class="toast hidden"></div><script>
'use strict';const KEY='nawab_ride_v4';const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const defaults={lang:'en',goals:{daily:0,weekly:0,monthly:0},entries:[]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){data=JSON.parse(JSON.stringify(defaults))}data.goals={...defaults.goals,...data.goals};data.entries=Array.isArray(data.entries)?data.entries:[];let page='home',period='daily',offset=0,deletePeriod='daily',deleteOffset=0,deleteStart=null,deleteTimer=null,entryType='income';const L={en:{app:'Nawab Ride',settings:'Settings',daily:'Daily',weekly:'Weekly',monthly:'Monthly',net:'Net Earnings',earned:'Total Earned',spent:'Total Spent',add:'Add Money',spend:'Spend Money',goals:'My Goals',edit:'Edit Goals',target:'Target',left:'Remaining',achieved:'Goal achieved',history:'Transactions',none:'No transactions for this period',language:'Language',setgoals:'Set Earnings Goals',delete:'Delete Earnings Records',backup:'Export Backup',restore:'Import Backup',amount:'Amount (₹)',category:'Category',note:'Note (optional)',save:'Save',back:'Back',cancel:'Cancel',confirm:'Confirm Delete',wait:'Please wait for the countdown to finish before confirming deletion.',warning:'This permanently deletes all income and expenses in the selected period.',start:'Start 30-Second Countdown',seconds:'SECONDS',deleted:'Records deleted',saved:'Saved successfully',invalid:'Enter a valid amount',confirming:'Deletion is now available',today:'Today',current:'Current period',income:'Income',expense:'Expense',ride:'Ride',petrol:'Petrol',fees:'Platform Fees',food:'Food',other:'Other',date:'Date',exported:'Backup downloaded',imported:'Backup imported',importfail:'Invalid backup file',nodata:'No goal set',set:'Set goal',more:'More',backups:'Backup & Restore',deletehelp:'Choose a period and date using the arrows.',deleteReady:'Review your selection and confirm deletion.'},hi:{app:'नवाब राइड',settings:'सेटिंग्स',daily:'दैनिक',weekly:'साप्ताहिक',monthly:'मासिक',net:'शुद्ध कमाई',earned:'कुल कमाई',spent:'कुल खर्च',add:'पैसे जोड़ें',spend:'खर्च दर्ज करें',goals:'मेरे लक्ष्य',edit:'लक्ष्य बदलें',target:'लक्ष्य',left:'शेष',achieved:'लक्ष्य पूरा हुआ',history:'लेन-देन',none:'इस अवधि में कोई लेन-देन नहीं',language:'भाषा',setgoals:'कमाई के लक्ष्य तय करें',delete:'कमाई का रिकॉर्ड मिटाएँ',backup:'बैकअप डाउनलोड करें',restore:'बैकअप वापस लाएँ',amount:'राशि (₹)',category:'श्रेणी',note:'विवरण (वैकल्पिक)',save:'सहेजें',back:'वापस',cancel:'रद्द करें',confirm:'मिटाने की पुष्टि करें',wait:'मिटाने की पुष्टि करने से पहले उलटी गिनती पूरी होने तक प्रतीक्षा करें।',warning:'चुनी हुई अवधि की पूरी कमाई और खर्च का रिकॉर्ड स्थायी रूप से मिट जाएगा।',start:'30 सेकंड की उलटी गिनती शुरू करें',seconds:'सेकंड',deleted:'रिकॉर्ड मिटा दिए गए',saved:'सफलतापूर्वक सहेजा गया',invalid:'सही राशि दर्ज करें',confirming:'अब रिकॉर्ड मिटाने की पुष्टि कर सकते हैं',today:'आज',current:'वर्तमान अवधि',income:'कमाई',expense:'खर्च',ride:'सवारी',petrol:'पेट्रोल',fees:'प्लेटफ़ॉर्म शुल्क',food:'भोजन',other:'अन्य',date:'तारीख',exported:'बैकअप डाउनलोड हो गया',imported:'बैकअप वापस आ गया',importfail:'बैकअप फ़ाइल सही नहीं है',nodata:'लक्ष्य तय नहीं है',set:'लक्ष्य तय करें',more:'अधिक',backups:'बैकअप और वापसी',deletehelp:'अवधि चुनें और तीरों से तारीख बदलें।',deleteReady:'चयन की जाँच करके मिटाने की पुष्टि करें।'}};const t=k=>L[data.lang][k]||k;const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}function startOf(p,o){let d=new Date();d.setHours(12,0,0,0);if(p==='daily')d.setDate(d.getDate()+o);if(p==='weekly'){let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+o*7)}if(p==='monthly')d=new Date(d.getFullYear(),d.getMonth()+o,1,12);return d}function bounds(p,o){let s=startOf(p,o),e=new Date(s);if(p==='daily')e.setDate(e.getDate()+1);if(p==='weekly')e.setDate(e.getDate()+7);if(p==='monthly')e.setMonth(e.getMonth()+1);return [s,e]}function dayDate(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}function periodEntries(p,o){let [s,e]=bounds(p,o);return data.entries.filter(x=>{let d=dayDate(x.date);return d>=s&&d<e})}function totals(p,o){let list=periodEntries(p,o);return {income:list.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),expense:list.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}}function net(p,o){let x=totals(p,o);return x.income-x.expense}function label(p,o){let [s,e]=bounds(p,o),opt={day:'numeric',month:'short',year:'numeric'};if(p==='daily')return s.toLocaleDateString(data.lang==='hi'?'hi-IN':'en-IN',opt);if(p==='monthly')return s.toLocaleDateString(data.lang==='hi'?'hi-IN':'en-IN',{month:'long',year:'numeric'});let end=new Date(e);end.setDate(end.getDate()-1);return s.toLocaleDateString(data.lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString(data.lang==='hi'?'hi-IN':'en-IN',opt)}function header(){return `<div class="top"><div class="brand"><span>◈</span> ${t('app')}</div><button class="iconbtn" onclick="go('settings')">⚙ ${t('settings')}</button></div>`}function nav(p,o,kind){return `<div class="navdate"><button onclick="shift('${kind}',-1)">❮</button><div class="center"><div class="small">${t(p)}</div><strong>${esc(label(p,o))}</strong></div><button ${o>=0?'disabled':''} onclick="shift('${kind}',1)">❯</button></div>`}function circle(p){let goal=Number(data.goals[p])||0,earned=net(p,0),pct=goal>0?Math.round(earned/goal*100):0,remain=Math.max(0,goal-earned);let arc=goal>0?Math.min(100,Math.max(0,pct)):0;return `<div class="goal"><div class="name">${t(p)}</div><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#304455" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="#48dca6" stroke-width="9" stroke-linecap="round" stroke-dasharray="251.327" stroke-dashoffset="${251.327*(1-arc/100)}"/></svg><div class="percent">${goal?pct+'%':'—'}</div></div><div class="number">${fmt(Math.max(0,earned))} / ${fmt(goal)}</div><div class="remaining">${goal?t('left')+': '+fmt(remain):t('nodata')}</div></div>`}function home(){let a=totals(period,offset),entries=periodEntries(period,offset).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);return header()+`<div class="tabs">${['daily','weekly','monthly'].map(p=>`<button class="${p===period?'active':''}" onclick="changePeriod('${p}')">${t(p)}</button>`).join('')}</div><section class="panel">${nav(period,offset,'home')}<div class="center"><div class="small" style="margin-top:18px">${t('net')}</div><div class="balance">${fmt(a.income-a.expense)}</div></div><div class="stats"><div><div class="small">${t('earned')}</div><strong class="green">${fmt(a.income)}</strong></div><div><div class="small">${t('spent')}</div><strong class="red">${fmt(a.expense)}</strong></div></div></section><div class="actions"><button class="action add" onclick="newEntry('income')"><b>⊕</b>${t('add')}</button><button class="action spend" onclick="newEntry('expense')"><b>⊖</b>${t('spend')}</button></div><div class="row"><div class="sectiontitle">◎ ${t('goals')}</div><button class="iconbtn" onclick="go('goals')">✎ ${t('edit')}</button></div><div class="goalgrid">${['daily','weekly','monthly'].map(circle).join('')}</div><div class="transactions"><div class="sectiontitle">${t('history')}</div>${entries.length?entries.map(x=>`<div class="entry"><div><strong>${esc(t(x.category)||x.category)}</strong><div class="detail">${esc(x.date)}${x.note?' · '+esc(x.note):''}</div></div><strong class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'}${fmt(x.amount)}</strong></div>`).join(''):`<div class="empty">${t('none')}</div>`}</div>`}function settings(){return `${header()}<div class="pagehead">${t('settings')}</div><div class="field"><label>${t('language')}</label><div class="pills"><button class="${data.lang==='en'?'active':''}" onclick="language('en')">English</button><button class="${data.lang==='hi'?'active':''}" onclick="language('hi')">हिंदी</button></div></div><button class="itembtn" onclick="go('goals')">◎ ${t('setgoals')}　›</button><button class="itembtn" onclick="go('delete')">♧ ${t('delete')}　›</button><button class="itembtn" onclick="exportBackup()">↓ ${t('backup')}</button><button class="itembtn" onclick="document.getElementById('backupfile').click()">↑ ${t('restore')}</button><input style="display:none" id="backupfile" type="file" accept="application/json,.json" onchange="importBackup(this)"><button class="primary secondary" onclick="go('home')">${t('back')}</button>`}function goals(){return `${header()}<div class="pagehead">${t('setgoals')}</div>${['daily','weekly','monthly'].map(p=>`<div class="field"><label>${t(p)} ${t('target')} (₹)</label><input id="goal_${p}" type="number" min="0" step="1" inputmode="decimal" value="${data.goals[p]||''}" placeholder="0"></div>`).join('')}<button class="primary" onclick="saveGoals()">${t('save')}</button><button class="primary secondary" onclick="go('home')">${t('cancel')}</button>`}function entry(){return `${header()}<div class="pagehead">${entryType==='income'?t('add'):t('spend')}</div><div class="field"><label>${t('amount')}</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0"></div><div class="field"><label>${t('date')}</label><input id="entrydate" type="date" value="${today()}"></div><div class="field"><label>${t('category')}</label><select id="category">${(entryType==='income'?['ride','other']:['petrol','fees','food','other']).map(x=>`<option value="${x}">${t(x)}</option>`).join('')}</select></div><div class="field"><label>${t('note')}</label><input id="note" maxlength="100"></div><button class="primary" onclick="saveEntry()">${t('save')}</button><button class="primary secondary" onclick="go('home')">${t('cancel')}</button>`}function deletePage(){return `${header()}<div class="pagehead">${t('delete')}</div><p class="hint">${t('deletehelp')}</p><div class="tabs">${['daily','weekly','monthly'].map(p=>`<button class="${p===deletePeriod?'active':''}" onclick="changeDeletePeriod('${p}')">${t(p)}</button>`).join('')}</div><section class="panel">${nav(deletePeriod,deleteOffset,'delete')}<div class="center" style="margin-top:20px"><div class="small">${t('net')}</div><div class="balance">${fmt(net(deletePeriod,deleteOffset))}</div><div class="small">${periodEntries(deletePeriod,deleteOffset).length} ${t('history')}</div></div></section><p class="hint">${t('warning')}</p><div id="deleteControl"><button class="primary danger" onclick="startDelete()">${t('start')}</button></div><button class="primary secondary" onclick="cancelDelete();go('settings')">${t('cancel')}</button>`}function go(p){cancelDelete();page=p;render()}function render(){document.documentElement.lang=data.lang;document.getElementById('app').innerHTML=page==='home'?home():page==='settings'?settings():page==='goals'?goals():page==='entry'?entry():deletePage()}function changePeriod(p){period=p;offset=0;render()}function shift(which,delta){if(which==='home')offset=Math.min(0,offset+delta);else{deleteOffset=Math.min(0,deleteOffset+delta);cancelDelete()}render()}function language(v){data.lang=v;save();render()}function newEntry(type){entryType=type;go('entry')}function saveEntry(){let amount=Number(document.getElementById('amount').value),date=document.getElementById('entrydate').value;if(!Number.isFinite(amount)||amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast(t('invalid'));return}data.entries.push({id:Date.now(),date,type:entryType,amount:Math.round(amount*100)/100,category:document.getElementById('category').value,note:document.getElementById('note').value.trim()});save();go('home');toast(t('saved'))}function saveGoals(){let next={};for(let p of ['daily','weekly','monthly']){let raw=document.getElementById('goal_'+p).value;let v=raw===''?0:Number(raw);if(!Number.isFinite(v)||v<0){toast(t('invalid'));return}next[p]=Math.round(v*100)/100}data.goals=next;save();go('home');toast(t('saved'))}function changeDeletePeriod(p){deletePeriod=p;deleteOffset=0;cancelDelete();render()}function cancelDelete(){if(deleteTimer)clearInterval(deleteTimer);deleteTimer=null;deleteStart=null}function startDelete(){cancelDelete();deleteStart=Date.now();showDelete();deleteTimer=setInterval(()=>{showDelete();if(Date.now()-deleteStart>=30000){clearInterval(deleteTimer);deleteTimer=null}},180)}function showDelete(){let c=document.getElementById('deleteControl');if(!c)return;let left=Math.max(0,Math.ceil((30000-(Date.now()-deleteStart))/1000));let progress=(30-left)/30;c.innerHTML=`<div class="delete-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#354252" stroke-width="7"/><circle cx="50" cy="50" r="42" fill="none" stroke="#ff6e7c" stroke-width="7" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="${263.89*(1-progress)}"/></svg><div class="count">${left}<small>${t('seconds')}</small></div></div><p class="hint center">${left?t('wait'):t('deleteReady')}</p><button class="primary danger" ${left?'disabled':''} onclick="confirmDelete()">${t('confirm')}</button>`}function confirmDelete(){if(!deleteStart||Date.now()-deleteStart<30000)return;let ids=new Set(periodEntries(deletePeriod,deleteOffset).map(x=>x.id));data.entries=data.entries.filter(x=>!ids.has(x.id));save();cancelDelete();go('home');toast(t('deleted'))}function exportBackup(){let blob=new Blob([JSON.stringify({version:4,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nawab-ride-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('exported'))}function importBackup(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.entries)||!obj.goals||!['en','hi'].includes(obj.lang))throw Error('invalid');for(let x of obj.entries)if(!['income','expense'].includes(x.type)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!Number.isFinite(x.amount)||x.amount<0)throw Error('invalid');data={lang:obj.lang,goals:{...defaults.goals,...obj.goals},entries:obj.entries};save();go('home');toast(t('imported'))}catch(e){toast(t('importfail'))}};reader.readAsText(file)}render();
</script></body></html>
